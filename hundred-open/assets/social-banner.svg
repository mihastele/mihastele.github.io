<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Hundred Open Web Tools</title>
  <desc id="desc">A modern promotion banner for 100 browser-based free tools</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="170" cy="150" r="120" fill="#ffffff" fill-opacity="0.06"/>
  <circle cx="1050" cy="540" r="200" fill="#ffffff" fill-opacity="0.04"/>
  <rect x="86" y="88" width="1028" height="454" rx="36" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.18"/>
  <g transform="translate(122,150)">
    <rect width="180" height="180" rx="38" fill="#ffffff" fill-opacity="0.11"/>
    <text x="90" y="110" font-size="96" text-anchor="middle" fill="#fff">🧰</text>
    <g fill="#fff">
      <rect x="232" y="20" width="130" height="18" rx="9" fill-opacity="0.9"/>
      <rect x="232" y="62" width="180" height="18" rx="9" fill-opacity="0.7"/>
      <rect x="232" y="104" width="212" height="18" rx="9" fill-opacity="0.6"/>
      <rect x="232" y="146" width="172" height="18" rx="9" fill-opacity="0.45"/>
    </g>
  </g>
  <g transform="translate(710,170)">
    <text x="0" y="70" font-size="56" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#ffffff">100 free</text>
    <text x="0" y="138" font-size="56" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#c4b5fd">browser tools</text>
    <text x="0" y="200" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#e2e8f0">Image • Text • Developer • Security • Math • Design</text>
    <g transform="translate(0,236)">
      <rect width="270" height="70" rx="18" fill="#f8fafc" fill-opacity="0.15"/>
      <text x="34" y="45" font-size="26" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#fff">No uploads</text>
      <text x="180" y="45" font-size="26" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#fbbf24">No tracking</text>
    </g>
  </g>
</svg>
